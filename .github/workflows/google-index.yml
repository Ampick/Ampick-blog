name: Google Instant Indexing

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  index-urls:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Wait for Site Build
        run: sleep 180

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: pip install requests google-auth

      - name: Run Indexing Script
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
        run: python index_api.py
